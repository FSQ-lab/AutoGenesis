<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 950" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Edge browser product-line deployment results</title>
  <desc id="desc">2.30 million test steps in a reported 30-day period, 3,193 hours saved monthly, four platforms, and 99.7 percent pass-rate consistency.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="720" y2="950" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="0.52" stop-color="#0b1930"/>
      <stop offset="1" stop-color="#10243a"/>
    </linearGradient>
    <linearGradient id="accent" x1="38" y1="40" x2="680" y2="890" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35c1f1"/>
      <stop offset="0.48" stop-color="#635bff"/>
      <stop offset="1" stop-color="#36c752"/>
    </linearGradient>
    <linearGradient id="number" x1="52" y1="210" x2="640" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72ddff"/>
      <stop offset="0.48" stop-color="#9b91ff"/>
      <stop offset="1" stop-color="#6ee787"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#8bb8dd" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="720" height="950" rx="30" fill="url(#panel)"/>
  <rect x="2" y="2" width="716" height="946" rx="28" fill="none" stroke="url(#accent)" stroke-width="4"/>
  <rect width="720" height="950" rx="30" fill="url(#grid)"/>

  <!-- Original browser/deployment glyph; not a Microsoft product icon. -->
  <g transform="translate(34 22)">
    <rect width="104" height="104" rx="26" fill="#ffffff" fill-opacity="0.08" stroke="url(#accent)" stroke-width="4"/>
    <path d="M2 31h100" stroke="#d9edff" stroke-opacity="0.65" stroke-width="3"/>
    <circle cx="19" cy="16" r="4" fill="#35c1f1"/>
    <circle cx="34" cy="16" r="4" fill="#9b91ff"/>
    <circle cx="49" cy="16" r="4" fill="#36c752"/>
    <path d="m19 78 17-17 15 10 29-29" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m70 42h10v10" fill="none" stroke="#6ee787" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="164" y="58" fill="#87dfff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="2.2">PROVEN AT PRODUCTION SCALE</text>
  <text x="164" y="105" fill="#f3f8ff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31" font-weight="650">Microsoft Edge browser product line</text>
  <path d="M44 144h632" stroke="url(#accent)" stroke-width="3"/>

  <g transform="translate(44 180)">
    <rect width="632" height="218" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#35c1f1" stroke-opacity="0.35" stroke-width="2"/>
    <text x="30" y="112" fill="url(#number)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="112" font-weight="760" letter-spacing="-5">2.30M</text>
    <text x="32" y="158" fill="#f3f8ff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="650" letter-spacing="0.8">TEST STEPS</text>
    <text x="32" y="195" fill="#a9b9ca" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26">Reported 30-day period</text>
  </g>

  <g transform="translate(44 424)">
    <rect width="632" height="218" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#635bff" stroke-opacity="0.42" stroke-width="2"/>
    <text x="30" y="112" fill="url(#number)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="112" font-weight="760" letter-spacing="-5">3,193</text>
    <text x="32" y="158" fill="#f3f8ff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="650" letter-spacing="0.8">HOURS SAVED / MONTH</text>
    <text x="32" y="195" fill="#a9b9ca" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26">Measured operating impact</text>
  </g>

  <g transform="translate(44 668)">
    <rect width="306" height="188" rx="22" fill="#ffffff" fill-opacity="0.055" stroke="#35c1f1" stroke-opacity="0.35" stroke-width="2"/>
    <text x="24" y="73" fill="#72ddff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="66" font-weight="750">4</text>
    <text x="24" y="112" fill="#f3f8ff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="650">PLATFORMS</text>
    <text x="24" y="145" fill="#a9b9ca" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23">Windows · macOS</text>
    <text x="24" y="174" fill="#a9b9ca" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23">iOS · Android</text>
  </g>

  <g transform="translate(370 668)">
    <rect width="306" height="188" rx="22" fill="#ffffff" fill-opacity="0.055" stroke="#36c752" stroke-opacity="0.35" stroke-width="2"/>
    <text x="24" y="73" fill="#6ee787" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="66" font-weight="750">99.7%</text>
    <text x="24" y="112" fill="#f3f8ff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="650">PASS-RATE</text>
    <text x="24" y="145" fill="#a9b9ca" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23">Consistency</text>
  </g>

  <text x="360" y="908" text-anchor="middle" fill="#a9b9ca" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">Observed Edge deployment results</text>
  <text x="360" y="938" text-anchor="middle" fill="#8192a5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Not a universal benchmark</text>
</svg>
