[build-system]
requires = ["setuptools>=77,<81", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "autogenesis-appium-mcp"
version = "0.5.0"
description = "Appium MCP Server for mobile automation testing"
readme = "README.md"
authors = [
    {name = "AutoGenesis Team"}
]
requires-python = ">=3.10"
dependencies = [
    "autogenesis-agent-contract==2.1.0",
    "anyio>=4.5,<5",
    "pydantic>=2.7,<3",
    "requests>=2.31,<3",
    "python-dotenv>=1,<2",
    "langchain-core>=0.1.52",
    "mcp>=1.23.0,<1.30",
    "selenium>=4.0.0",
    "appium-python-client>=2.0.0",
    "behave==1.2.6",
    "langchain-openai>=0.0.8",
    "langchain-anthropic>=0.0.8",  
    "langchain-google-genai>=0.0.8",
    "pillow==12.1.0",
    "watchdog>=3.0.0",
]

[project.urls]
Repository = "https://github.com/FSQ-lab/AutoGenesis"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
autogenesis-appium-mcp = "autogenesis_appium_mcp.server:main"

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.setuptools.package-data]
autogenesis_appium_mcp = ["conf/appium_conf.template.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.uv]
dev-dependencies = [
    "pytest>=6.0.0",
    "black>=21.0.0",
    "flake8>=3.8.0",
    "mypy>=0.900",
]
