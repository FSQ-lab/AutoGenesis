[build-system]
requires = ["setuptools>=77,<81", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "autogenesis-cli"
version = "0.3.0"
description = "Install the AutoGenesis host runtime bundle and canonical Agent Skills"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "autogenesis-agent-contract==2.2.0",
    "autogenesis-appium-mcp==0.6.0; sys_platform == 'darwin' or sys_platform == 'win32'",
    "autogenesis-windows-mcp==0.6.0; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/FSQ-lab/AutoGenesis"

[project.scripts]
autogenesis = "autogenesis_cli.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
