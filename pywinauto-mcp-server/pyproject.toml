[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "autogenesis-windows-mcp"
version = "0.5.0"
description = "AutoGenesis Windows desktop MCP runtime"
readme = "WINDOWS-README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = ["Operating System :: Microsoft :: Windows"]
dependencies = [
    "autogenesis-agent-contract==2.1.0",
    "mcp>=1.23.0,<1.30",
    "anyio>=4.9,<5",
    "jsonschema>=4.20,<5",
    "python-dotenv>=1,<2",
    "psutil>=5.9,<8",
    "pillow>=10,<13",
    "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'",
    "pympler==1.1",
    "pydantic>=2.7,<3",
    "requests>=2.32,<3",
    "langchain-core>=0.2,<2",
    "langchain-openai>=0.1,<2",
    "behave==1.2.6",
]

[project.urls]
Repository = "https://github.com/FSQ-lab/AutoGenesis"

[project.scripts]
autogenesis-windows-mcp = "autogenesis_windows_mcp.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "packaging>=24,<27"]

[tool.hatch.build.targets.wheel]
packages = ["src/autogenesis_windows_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "simple_server.py", "conf/pywinauto_conf.example.json", "pyproject.toml", "requirements.txt", "WINDOWS-README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["windows: requires the real Windows automation dependencies"]
