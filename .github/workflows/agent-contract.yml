name: Agent Contract

on:
  pull_request:
    branches: [main, feature/agent-integration-v2]
    paths:
      - 'agent-contract/**'
      - '.github/skills/autogenesis-setup/SKILL.md'
      - '.github/skills/autogenesis-run/SKILL.md'
      - '.github/workflows/agent-contract.yml'
  push:
    branches: [feature/agent-integration-v2]
    paths:
      - 'agent-contract/**'
      - '.github/skills/autogenesis-setup/SKILL.md'
      - '.github/skills/autogenesis-run/SKILL.md'
      - '.github/workflows/agent-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / MCP ${{ matrix.mcp }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
            mcp: '1.23.0'
          - os: ubuntu-24.04
            python: '3.12'
            mcp: '1.29.1'
          - os: windows-2022
            python: '3.12'
            mcp: '1.29.1'
    steps:
      - name: Preserve exact LF asset bytes on every runner
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Checkout pinned upstream Appium Skills
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: appium/skills
          ref: e907024c210fe024c956ed9c74146fc27b1dd013
          path: upstream-appium-skills
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check release and generated Skills
        run: |
          python agent-contract/tools/freeze_appium_skills.py --upstream-root upstream-appium-skills
          python agent-contract/tools/freeze_assets.py
          python agent-contract/tools/sync_skills.py --check
      - name: Install wheel builder
        run: python -m pip --disable-pip-version-check install 'build>=1.2,<2'
      - name: Build contract wheel
        run: python -m build --wheel --outdir '${{ runner.temp }}/contract-wheel' agent-contract
      - name: Verify installed wheel in a fresh business project
        run: >-
          python agent-contract/tools/verify_wheel.py
          --wheel-dir '${{ runner.temp }}/contract-wheel'
          --mcp-version '${{ matrix.mcp }}'
          --evidence-dir '${{ runner.temp }}/contract-evidence'
      - name: Upload wheel and protocol evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-contract-${{ matrix.os }}-py${{ matrix.python }}-mcp${{ matrix.mcp }}
          path: |
            ${{ runner.temp }}/contract-wheel
            ${{ runner.temp }}/contract-evidence
          if-no-files-found: warn

  appium-skills:
    name: Official Appium Skills / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2022]
        node: ['20', '22', '24']
    defaults:
      run:
        working-directory: agent-contract/src/autogenesis_agent_contract/assets/skills/autogenesis-setup/references/appium-skills
    steps:
      - name: Preserve exact LF asset bytes
        run: git config --global core.autocrlf false
        working-directory: .
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Validate immutable upstream structure
        run: node tools/validate-repository.mjs
      - name: Run upstream helper tests
        run: node --test tools/tests/helpers.test.mjs
