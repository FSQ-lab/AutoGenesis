name: Windows runtime package

on:
  pull_request:
    branches: [main, feature/agent-integration]
    paths:
      - 'pywinauto-mcp-server/**'
      - 'agent-contract/**'
      - '.github/workflows/windows-package.yml'
  push:
    branches: [feature/agent-integration]
    paths:
      - 'pywinauto-mcp-server/**'
      - 'agent-contract/**'
      - '.github/workflows/windows-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / MCP ${{ matrix.mcp }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
        python: ['3.10', '3.12']
        mcp: ['1.23.0', '1.29.1']
    steps:
      - name: Preserve exact contract LF bytes
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install wheel builder
        run: python -m pip --disable-pip-version-check install 'build>=1.2,<2'
      - name: Build canonical contract wheel
        run: python -m build --wheel --outdir '${{ runner.temp }}/windows-wheels' agent-contract
      - name: Build Windows runtime wheel
        run: python -m build --wheel --outdir '${{ runner.temp }}/windows-wheels' pywinauto-mcp-server
      - name: Clean business-project wheel acceptance (Linux metadata/import only)
        run: >-
          python pywinauto-mcp-server/scripts/verify_wheel.py
          --wheel-dir '${{ runner.temp }}/windows-wheels'
          --mcp-version '${{ matrix.mcp }}'
          --evidence-dir '${{ runner.temp }}/windows-evidence'
      - name: Upload built wheels and sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-package-${{ matrix.os }}-py${{ matrix.python }}-mcp${{ matrix.mcp }}
          path: |
            ${{ runner.temp }}/windows-wheels
            ${{ runner.temp }}/windows-evidence
          if-no-files-found: warn
